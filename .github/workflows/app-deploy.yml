
name: G2B KONEP - App CD to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag (sha-<full commit SHA>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g2b-konep-dev-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI to EKS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment: g2b-konep-dev

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: "513329232596"
      EKS_CLUSTER_NAME: g2b-konep-dev-eks
      K8S_NAMESPACE: g2b-konep-dev
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || {
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.G2B_KONEP_EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: G2BKonepEKSDeploy

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

      - name: Verify ECR images
        shell: bash
        run: |
          set -euo pipefail
          for SERVICE in organization notice; do
            aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "g2b-konep-dev-$SERVICE" \
              --image-ids "imageTag=$IMAGE_TAG"
          done

      - name: Configure kubectl
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify cluster access
        shell: bash
        run: |
          kubectl auth can-i get deployments \
            --namespace "$K8S_NAMESPACE"
          kubectl auth can-i patch deployments \
            --namespace "$K8S_NAMESPACE"

      - name: Deploy FastAPI services
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          ORG_IMAGE="${REGISTRY}/g2b_konep-dev-organization:${IMAGE_TAG}"
          NOTICE_IMAGE="${REGISTRY}/g2b_konep-dev-notice:${IMAGE_TAG}"

          # Namespace must already exist.
          kubectl get namespace "$K8S_NAMESPACE"

          sed \
            -e 's/namespace: pps-dev/namespace: g2b-konep-dev/g' \
            -e "s|__IMAGE__|${ORG_IMAGE}|g" \
            infra/kubernetes/organization.yaml \
            | kubectl apply -n "$K8S_NAMESPACE" -f -

          sed \
            -e 's/namespace: pps-dev/namespace: g2b-konep-dev/g' \
            -e "s|__IMAGE__|${NOTICE_IMAGE}|g" \
            infra/kubernetes/notice.yaml \
            | kubectl apply -n "$K8S_NAMESPACE" -f -

      - name: Wait for rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/organization --timeout=300s

          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/notice --timeout=300s

      - name: Deployment summary
        shell: bash
        run: |
          echo "## G2B KONEP App Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Cluster: $EKS_CLUSTER_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Namespace: $K8S_NAMESPACE" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

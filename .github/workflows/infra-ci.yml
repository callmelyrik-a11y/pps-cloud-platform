
name: Infra CI - Terraform validate

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-deploy.yml"

  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # 1. Secret scanning
  # ==========================================================
  security:
    name: "1. Secret Leak Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  # ==========================================================
  # 2. Terraform validation
  # ==========================================================
  validate:
    name: "2. Terraform Validate"
    needs: security
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform fmt in CI workspace
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive

      - name: Clean local Terraform directory
        run: rm -rf .terraform

      - name: Terraform init without backend
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color


name: Infra CI-CD - PPS Dev

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-deploy.yml"

  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation"
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      dry_run:
        description: "Verify Apply without deploying"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: terraform-pps-dev-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_frontend_bucket_name: ${{ vars.PPS_DEV_FRONTEND_BUCKET_NAME }}
  TF_VAR_cluster_public_access_cidrs: ${{ vars.PPS_DEV_CLUSTER_PUBLIC_ACCESS_CIDRS }}

jobs:
  # ==========================================================
  # 0. Secret scan
  # ==========================================================
  security:
    name: "0. Secret Leak Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  # ==========================================================
  # 1. Terraform FMT -> main auto commit
  # ==========================================================
  format:
    name: "1. Terraform Auto Format"
    needs: security
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      formatted_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Run terraform fmt
        working-directory: infra/terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -recursive
          terraform fmt -check -recursive

      - name: Commit formatting to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u -- infra/terraform/environments/dev

          if ! git diff --cached --quiet; then
            git commit -m "style(terraform): auto format HCL"
            git push origin HEAD:refs/heads/main
          else
            echo "No formatting changes"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # 2. Terraform Validate
  # ==========================================================
  validate:
    name: "2. Terraform Validate"
    needs: format
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:
      - name: Checkout formatted commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.formatted_sha }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

  # ==========================================================
  # 3. Terraform Plan
  # ==========================================================
  plan:
    name: "3. Terraform Plan"
    needs: [format, validate]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:
      - name: Checkout formatted commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.formatted_sha }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify required variables
        env:
          PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail

          test -n "$PLAN_ROLE_ARN" || {
            echo "::error::Missing AWS_TERRAFORM_PLAN_ROLE_ARN"
            exit 1
          }

          test -n "$TF_VAR_frontend_bucket_name" || {
            echo "::error::Missing frontend bucket variable"
            exit 1
          }

          python3 - <<'PY'
          import ipaddress
          import json
          import os

          try:
              cidrs = json.loads(
                  os.environ["TF_VAR_cluster_public_access_cidrs"]
              )
              if not isinstance(cidrs, list) or not cidrs:
                  raise ValueError("CIDR list is empty")

              for cidr in cidrs:
                  if not isinstance(cidr, str):
                      raise ValueError("CIDR must be a string")
                  network = ipaddress.ip_network(
                      cidr, strict=False
                  )
                  if network.prefixlen == 0:
                      raise ValueError(
                          "0.0.0.0/0 and ::/0 are prohibited"
                      )

          except (ValueError, TypeError, KeyError) as exc:
              raise SystemExit(
                  f"Invalid EKS API CIDRs: {exc}"
              )

          print("Required configuration verified")
          PY

      - name: Configure AWS credentials - Plan
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "513329232596"
          role-session-name: GitHubActions-PPS-Plan

      # ------------------------------------------------------
      # Provider checksum diagnosis
      # ------------------------------------------------------
      - name: Display Terraform version and lockfile
        run: |
          set -euo pipefail

          terraform version
          terraform providers

          test -f .terraform.lock.hcl || {
            echo "::error::Missing .terraform.lock.hcl"
            exit 1
          }

          echo "Provider lock file exists"

      - name: Clean local Terraform installation
        run: |
          set -euo pipefail

          rm -rf .terraform

          echo "Removed local provider installation"
          echo "Remote Terraform state was not modified"

      - name: Terraform init - S3 remote backend
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Verify installed provider checksums
        run: |
          set -euo pipefail

          terraform validate -no-color

          echo "Terraform provider verification passed"

      # ------------------------------------------------------
      # Full Terraform Plan output
      # ------------------------------------------------------
      - name: Terraform plan - full GitHub Actions log
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=tfplan

      - name: Display complete saved plan
        run: |
          terraform show -no-color tfplan

      - name: Write plan summary
        env:
          FORMATTED_SHA: ${{ needs.format.outputs.formatted_sha }}
        run: |
          set -euo pipefail

          terraform show -json tfplan \
            > "$RUNNER_TEMP/terraform-plan.json"

          python3 - <<'PY'
          import collections
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "terraform-plan.json"
          )

          with open(path, encoding="utf-8") as f:
              plan = json.load(f)

          counts = collections.Counter()

          for resource in plan.get("resource_changes", []):
              actions = resource.get(
                  "change", {}
              ).get("actions", [])

              if actions != ["no-op"]:
                  counts["/".join(actions)] += 1

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("## G2B KONEP Terraform Plan\n\n")
              f.write(
                  "Commit: `"
                  + os.environ["FORMATTED_SHA"]
                  + "`\n\n"
              )

              for action, count in sorted(counts.items()):
                  f.write(f"- {action}: {count}\n")

              if not counts:
                  f.write("- No changes\n")

              f.write(
                  "\nFull plan: see Terraform Plan job logs.\n"
              )
          PY

      # ------------------------------------------------------
      # Encrypt plan artifact
      # ------------------------------------------------------
      - name: Encrypt Terraform plan
        if: >-
          github.event_name == 'push' ||
          inputs.operation == 'apply'
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          test "${#PLAN_KEY}" -ge 32 || {
            echo "::error::Missing TF_PLAN_ENCRYPTION_KEY"
            exit 1
          }

          printf '%s' "$PLAN_KEY" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output tfplan.gpg \
            tfplan

          chmod 600 tfplan.gpg
          rm -f tfplan

      - name: Upload encrypted Terraform plan
        if: >-
          github.event_name == 'push' ||
          inputs.operation == 'apply'
        uses: actions/upload-artifact@v6
        with:
          name: pps-dev-tfplan-${{ github.run_id }}
          path: |
            infra/terraform/environments/dev/tfplan.gpg
            infra/terraform/environments/dev/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ==========================================================
  # 4. Manual approval -> Terraform Apply
  # ==========================================================
  apply:
    name: "4. Approve and Deploy AWS"
    needs: [format, plan]

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       inputs.operation == 'apply')

    runs-on: ubuntu-latest
    environment: pps-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:
      - name: Checkout formatted commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.formatted_sha }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Apply authorization
        if: >-
          github.event_name == 'push' ||
          inputs.dry_run == false
        env:
          APPLY_ENABLED: ${{ vars.PPS_APPLY_ENABLED }}
        run: |
          test "$APPLY_ENABLED" = "true" || {
            echo "::error::PPS_APPLY_ENABLED must be true"
            exit 1
          }

      - name: Verify Apply role
        env:
          APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
        run: |
          test -n "$APPLY_ROLE_ARN" || {
            echo "::error::Missing Apply IAM role"
            exit 1
          }

      - name: Configure AWS credentials - Apply
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "513329232596"
          role-session-name: GitHubActions-PPS-Apply

      - name: Download encrypted plan
        uses: actions/download-artifact@v6
        with:
          name: pps-dev-tfplan-${{ github.run_id }}
          path: infra/terraform/environments/dev

      - name: Verify downloaded artifact
        run: |
          test -s tfplan.gpg
          test -s .terraform.lock.hcl

      - name: Clean Terraform working directory
        run: rm -rf .terraform

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Decrypt approved plan
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          test "${#PLAN_KEY}" -ge 32 || {
            echo "::error::Missing encryption key"
            exit 1
          }

          printf '%s' "$PLAN_KEY" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt \
            --output tfplan \
            tfplan.gpg

          chmod 600 tfplan
          terraform show -json tfplan > /dev/null

      - name: Dry-run verification
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true
        run: |
          echo "OIDC authentication succeeded"
          echo "Saved plan decrypted and verified"
          echo "Dry-run: AWS resources not changed"

      - name: Apply exact saved plan
        if: >-
          github.event_name == 'push' ||
          inputs.dry_run == false
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            tfplan

      - name: Remove plaintext plan
        if: always()
        run: rm -f tfplan tfplan.gpg

  # ==========================================================
  # 5. Discord notification
  # ==========================================================
  notify:
    name: "5. Discord Notification"
    needs: [security, format, validate, plan, apply]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send pipeline result
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          DISCORD_FORUM_CHANNEL: ${{ vars.DISCORD_FORUM_CHANNEL }}

          SECURITY_RESULT: ${{ needs.security.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CI_RESULT: ${{ needs.validate.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLY_RESULT: ${{ needs.apply.result }}

          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          e = os.environ
          webhook = e.get("DISCORD_WEBHOOK_URL", "").strip()

          if not webhook:
              print("Discord webhook not configured")
              raise SystemExit(0)

          results = {
              "Security": e["SECURITY_RESULT"],
              "Format": e["FORMAT_RESULT"],
              "CI": e["CI_RESULT"],
              "Plan": e["PLAN_RESULT"],
              "Apply": e["APPLY_RESULT"]
          }

          if "failure" in results.values():
              title = "PPS Terraform Pipeline Failed"
              color = 15158332
          elif "cancelled" in results.values():
              title = "PPS Terraform Pipeline Cancelled"
              color = 15844367
          elif e["EVENT_NAME"] == "workflow_dispatch" and \
               e.get("OPERATION", "plan") == "plan":
              title = "PPS Terraform Plan Completed"
              color = 3066993
          elif e["APPLY_RESULT"] == "success":
              title = "PPS Terraform Apply Job Completed"
              color = 3066993
          else:
              title = "PPS Terraform Pipeline Incomplete"
              color = 15844367

          run_url = (
              f"{e['GITHUB_SERVER_URL']}/"
              f"{e['GITHUB_REPOSITORY']}/"
              f"actions/runs/{e['GITHUB_RUN_ID']}"
          )

          fields = [
              {
                  "name": name,
                  "value": status,
                  "inline": True
              }
              for name, status in results.items()
          ]

          payload = {
              "username": "G2B KONEP Terraform Bot",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title,
                  "url": run_url,
                  "color": color,
                  "fields": fields
              }]
          }

          parts = urllib.parse.urlsplit(webhook)
          query = dict(
              urllib.parse.parse_qsl(parts.query)
          )
          query["wait"] = "true"

          thread = e.get("DISCORD_THREAD_ID", "").strip()

          if thread:
              query["thread_id"] = thread
          elif e.get(
              "DISCORD_FORUM_CHANNEL", ""
          ).lower() == "true":
              payload["thread_name"] = (
                  f"PPS Terraform Run {e['GITHUB_RUN_ID']}"
              )

          url = urllib.parse.urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urllib.parse.urlencode(query),
              parts.fragment
          ))

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  print(
                      "Discord notification HTTP",
                      response.status
                  )
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"Discord notification HTTP {exc.code}"
              ) from None
          PY

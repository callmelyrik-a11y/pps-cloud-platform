name: Infra CD - PPS Dev Plan / Apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      dry_run:
        description: "Test Apply job without creating AWS resources"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-pps-dev-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_frontend_bucket_name: ${{ vars.PPS_DEV_FRONTEND_BUCKET_NAME }}
  TF_VAR_cluster_public_access_cidrs: ${{ vars.PPS_DEV_CLUSTER_PUBLIC_ACCESS_CIDRS }}

jobs:

  # ============================================================
  # JOB 1: Terraform Plan
  # ============================================================

  plan:
    name: PPS Dev Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check repository paths
      - name: Check repository paths
        working-directory: ${{ github.workspace }}
        run: |
          echo "===== Workspace ====="
          pwd

          echo "===== Git information ====="
          git branch --show-current
          git rev-parse HEAD

          echo "===== Terraform files ====="
          git ls-files '*.tf'

          echo "===== Terraform directory ====="

          if [ ! -d "infra/terraform/environments/dev" ]; then
            echo "::error::Terraform directory does not exist"
            find . -maxdepth 6 -type d | sort
            exit 1
          fi

          ls -la infra/terraform/environments/dev

          echo "Terraform directory verified"

      # 3. Validate required configuration
      - name: Verify required configuration
        working-directory: ${{ github.workspace }}
        env:
          PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$TF_VAR_frontend_bucket_name" ]; then
            echo "::error::Missing PPS_DEV_FRONTEND_BUCKET_NAME"
            exit 1
          fi

          if [ -z "$TF_VAR_cluster_public_access_cidrs" ]; then
            echo "::error::Missing PPS_DEV_CLUSTER_PUBLIC_ACCESS_CIDRS"
            exit 1
          fi

          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::Missing AWS_TERRAFORM_PLAN_ROLE_ARN"
            exit 1
          fi

          if [[ "$TF_VAR_cluster_public_access_cidrs" == *'0.0.0.0/0'* ]]; then
            echo "::error::EKS API CIDR cannot contain 0.0.0.0/0"
            exit 1
          fi

          echo "Required configuration verified"

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 5. Configure AWS credentials using Plan Role
      - name: Configure AWS credentials - Plan
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PPS-Plan
          retry-max-attempts: 3

      # 6. Verify AWS account
      - name: Verify AWS identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [ "$ACCOUNT" != "513329232596" ]; then
            echo "::error::Wrong AWS account: $ACCOUNT"
            exit 1
          fi

          echo "AWS account verified: $ACCOUNT"

      # 7. Terraform init
      - name: Terraform init
        run: terraform init -input=false -no-color

      # 8. Terraform format check
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # 9. Terraform validate
      - name: Terraform validate
        run: terraform validate -no-color

      # 10. Terraform plan
      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      # 11. Display plan summary
      - name: Terraform plan summary
        run: terraform show -no-color tfplan

      # 12. Upload plan for Apply job
      - name: Upload saved plan artifact
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: pps-dev-tfplan
          path: infra/terraform/environments/dev/tfplan
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # JOB 2: Terraform Apply / Dry Run
  # ============================================================

  apply:
    name: PPS Dev Terraform Apply

    needs: plan

    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'apply'

    runs-on: ubuntu-latest

    environment: pps-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify real Apply authorization
      - name: Check Apply authorization
        if: inputs.dry_run == false
        working-directory: ${{ github.workspace }}
        env:
          APPLY_ENABLED: ${{ vars.PPS_APPLY_ENABLED }}
        run: |
          if [ "$APPLY_ENABLED" != "true" ]; then
            echo "::error::Actual Apply is disabled"
            echo "Set PPS_APPLY_ENABLED=true to deploy resources"
            exit 1
          fi

          echo "Actual Apply is authorized"

      # 3. Verify Terraform directory
      - name: Verify Terraform directory
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -d "infra/terraform/environments/dev" ]; then
            echo "::error::Terraform directory missing"
            exit 1
          fi

          echo "Terraform directory verified"

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 5. Inspect Apply OIDC claims
      # Diagnostic step: remove after successful authentication
      - name: Inspect Apply OIDC subject
        working-directory: ${{ github.workspace }}
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d \
            | jq '{sub, aud, repository, ref, environment}'

      # 6. Configure AWS credentials using Apply Role
      - name: Configure AWS credentials - Apply
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PPS-Apply
          retry-max-attempts: 3

      # 7. Verify AWS identity
      - name: Verify AWS identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [ "$ACCOUNT" != "513329232596" ]; then
            echo "::error::Wrong AWS account: $ACCOUNT"
            exit 1
          fi

          echo "AWS account verified: $ACCOUNT"

      # 8. Terraform init
      - name: Terraform init
        run: terraform init -input=false -no-color

      # 9. Download saved plan
      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: pps-dev-tfplan
          path: infra/terraform/environments/dev

      # 10. Verify saved plan
      - name: Verify saved plan
        run: |
          if [ ! -f tfplan ]; then
            echo "::error::Saved Terraform plan not found"
            exit 1
          fi

          echo "Saved Terraform plan found"
  # ============================================================
  # JOB 3: Discord Notification
  # ============================================================

  notify:
    name: Notify Discord

    needs:
      - plan
      - apply

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Send Terraform result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL"
            exit 1
          fi

          if [ "$PLAN_RESULT" = "failure" ] || \
             [ "$PLAN_RESULT" = "cancelled" ]; then
            STATUS="❌ Terraform Plan 실패 또는 취소"
            COLOR=15158332

          elif [ "$OPERATION" = "plan" ]; then
            STATUS="✅ Terraform Plan 성공"
            COLOR=3066993

          elif [ "$APPLY_RESULT" = "success" ]; then
            STATUS="🧪 Terraform Apply Dry Run 성공"
            COLOR=3447003

          elif [ "$APPLY_RESULT" = "success" ]; then
            STATUS="🚀 Terraform Apply 성공"
            COLOR=3066993

          elif [ "$APPLY_RESULT" = "failure" ] || \
               [ "$APPLY_RESULT" = "cancelled" ]; then
            STATUS="❌ Terraform Apply 실패 또는 취소"
            COLOR=15158332

          else
            STATUS="⚠️ Terraform Apply 미실행"
            COLOR=15844367
          fi

          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg title "$STATUS" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg operation "$OPERATION" \
            --arg plan "$PLAN_RESULT" \
            --arg apply "$APPLY_RESULT" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              username: "PPS Terraform Bot",
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    {
                      name: "Repository",
                      value: $repository,
                      inline: false
                    },
                    {
                      name: "Branch",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "Actor",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "Operation",
                      value: $operation,
                      inline: true
                    },
                    {
                      name: "Plan Result",
                      value: $plan,
                      inline: true
                    },
                    {
                      name: "Apply Result",
                      value: $apply,
                      inline: true
                    }
                  ],
                  url: $url,
                  footer: {
                    text: "PPS Cloud Platform | Terraform CI/CD"
                  }
                }
              ]
            }')

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord notification sent"

      # ========================================================
      # DRY RUN: Verify Apply workflow without creating resources
      # ========================================================

      - name: Dry-run Apply verification
        if: inputs.dry_run == true
        run: |
          echo "=================================="
          echo "       TERRAFORM DRY RUN"
          echo "=================================="

          echo "Apply job started successfully"
          echo "AWS OIDC authentication succeeded"
          echo "AWS account verified"
          echo "Terraform backend initialized"
          echo "Saved Terraform plan downloaded"

          terraform show -no-color tfplan > /dev/null

          echo "Saved Terraform plan verified"

          echo "=================================="
          echo "No terraform apply command executed"
          echo "No AWS infrastructure deployment"
          echo "=================================="

      # ========================================================
      # REAL APPLY: Deploy AWS resources
      # ========================================================

      - name: Apply exact saved plan
        if: >-
          inputs.dry_run == false &&
          vars.PPS_APPLY_ENABLED == 'true'
        run: |
          echo "===== Terraform Apply ====="

          terraform apply \
            -input=false \
            -no-color \
            tfplan

          echo "Terraform Apply completed"


name: Infra CD - PPS Dev Plan / Apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan = preview only; apply = plan then wait for environment approval"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-pps-dev-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_frontend_bucket_name: ${{ vars.PPS_DEV_FRONTEND_BUCKET_NAME }}
  TF_VAR_cluster_public_access_cidrs: ${{ vars.PPS_DEV_CLUSTER_PUBLIC_ACCESS_CIDRS }}

jobs:
  plan:
    name: PPS Dev Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/environments/dev
        shell: bash

    steps:
      # 1. Checkout must happen before running commands in Terraform directory
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect GitHub OIDC claims
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
      
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref, environment}'

      # 2. Inspect actual repository paths
      - name: Check repository paths
        working-directory: ${{ github.workspace }}
        run: |
          echo "===== Workspace ====="
          pwd

          echo "===== Git information ====="
          git branch --show-current
          git rev-parse HEAD

          echo "===== Repository root ====="
          ls -la

          echo "===== Tracked Terraform files ====="
          git ls-files '*.tf'

          echo "===== Expected Terraform directory ====="
          if [ -d "infra/terraform/environments/dev" ]; then
            echo "Terraform directory exists"
            ls -la infra/terraform/environments/dev
          else
            echo "::error::Terraform directory does not exist"
            echo "===== Available directories ====="
            find . -maxdepth 6 -type d | sort
            exit 1
          fi

      # 3. Validate GitHub Variables
      - name: Verify required non-secret configuration
        working-directory: ${{ github.workspace }}
        run: |
          test -n "$TF_VAR_frontend_bucket_name" || {
            echo "::error::Missing PPS_DEV_FRONTEND_BUCKET_NAME"
            exit 1
          }

          test -n "$TF_VAR_cluster_public_access_cidrs" || {
            echo "::error::Missing PPS_DEV_CLUSTER_PUBLIC_ACCESS_CIDRS"
            exit 1
          }

          test -n "${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}" || {
            echo "::error::Missing AWS_TERRAFORM_PLAN_ROLE_ARN"
            exit 1
          }

          if [[ "$TF_VAR_cluster_public_access_cidrs" == *'0.0.0.0/0'* ]]; then
            echo "::error::EKS API CIDR cannot contain 0.0.0.0/0"
            exit 1
          fi

          echo "Required configuration is present"

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 5. Assume AWS Plan Role using GitHub OIDC
      - name: Configure AWS credentials - Plan
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PPS-Plan

      # 6. Verify AWS identity and account
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT" != "513329232596" ]; then
            echo "::error::Wrong AWS account: $ACCOUNT"
            exit 1
          fi

          echo "AWS account verified: $ACCOUNT"

      # 7. Initialize Terraform backend
      - name: Terraform init
        run: terraform init -input=false -no-color

      # 8. Check Terraform formatting
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # 9. Validate Terraform configuration
      - name: Terraform validate
        run: terraform validate -no-color

      # 10. Generate execution plan
      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      # 11. Display plan
      - name: Terraform plan summary
        run: terraform show -no-color tfplan

      # 12. Upload saved plan only for apply operation
      - name: Upload saved plan artifact
        if: inputs.operation == 'apply' && vars.PPS_APPLY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pps-dev-tfplan
          path: infra/terraform/environments/dev/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: PPS Dev Approved Apply

    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'apply' &&
      vars.PPS_APPLY_ENABLED == 'true'

    needs: plan
    runs-on: ubuntu-latest

    environment: pps-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra/terraform/environments/dev
        shell: bash

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify Terraform directory
      - name: Verify Terraform directory
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -d "infra/terraform/environments/dev" ]; then
            echo "::error::Terraform directory missing"
            exit 1
          fi

          echo "Terraform directory verified"

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 4. Assume AWS Apply Role using GitHub OIDC
      - name: Configure AWS credentials - Apply
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PPS-Apply

      # 5. Verify AWS identity and account
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT" != "513329232596" ]; then
            echo "::error::Wrong AWS account: $ACCOUNT"
            exit 1
          fi

          echo "AWS account verified: $ACCOUNT"

      # 6. Initialize Terraform backend
      - name: Terraform init
        run: terraform init -input=false -no-color

      # 7. Download exact plan produced by Plan job
      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: pps-dev-tfplan
          path: infra/terraform/environments/dev

      # 8. Verify downloaded plan
      - name: Verify saved plan
        run: |
          test -f tfplan || {
            echo "::error::Saved Terraform plan not found"
            exit 1
          }

          echo "Saved Terraform plan found"

      # 9. Apply saved plan
      - name: Apply exact saved plan
        run: terraform apply -input=false -no-color tfplan

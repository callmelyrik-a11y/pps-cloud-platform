apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: zero-trust-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/callmelyrik-a11y/pps-cloud-platform.git
    targetRevision: main
    path: gitops/apps/zero-trust

  destination:
    server: https://kubernetes.default.svc
    namespace: security

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
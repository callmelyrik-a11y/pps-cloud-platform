# Illustrative manifests. Replace image/URLs when ECR repository and app are ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: { app: notice-api }
  template:
    metadata:
      labels: { app: notice-api }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: notice-api }
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE_URI
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notice-api
spec:
  type: ClusterIP
  selector: { app: notice-api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notice-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notice-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pps-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/notices
            pathType: Prefix
            backend:
              service:
                name: notice-api
                port:
                  number: 8000

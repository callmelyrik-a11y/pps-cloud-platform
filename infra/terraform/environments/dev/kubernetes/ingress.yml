apiVersion: v1
kind: Namespace
metadata:
  name: g2b-konep-dev
  labels:
    app.kubernetes.io/part-of: g2b-konep
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g2b-konep-dev-web-test
  namespace: g2b-konep-dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: g2b-konep-dev-web-test
  template:
    metadata:
      labels:
        app: g2b-konep-dev-web-test
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: g2b-konep-dev-web-test
      containers:
        - name: web
          image: nginx:stable-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              printf 'project=g2b-konep\nenvironment=dev\npod=%s\nnode=%s\n' "$POD_NAME" "$NODE_NAME" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: g2b-konep-dev-web-test
  namespace: g2b-konep-dev
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: g2b-konep-dev-web-test
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: g2b-konep-dev-web-test
  namespace: g2b-konep-dev
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: g2b-konep-dev-ingress-test
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:513329232596:certificate/e94ac631-4acd-4be4-a88b-ca347b1a07ce
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: g2b-konep-dev-web-test
                port:
                  name: http

          - path: /api/organizations
            pathType: Prefix
            backend:
              service:
                name: g2b-konep-dev-organization
                port:
                  number: 80
          - path: /api/notices
            pathType: Prefix
            backend:
              service:
                name: g2b-konep-dev-notice
                port:
                  number: 80
